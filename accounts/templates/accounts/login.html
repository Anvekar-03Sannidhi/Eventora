<h1>Login Page</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Login
    </button>

    <div class="signup-link">
        <p>
            New User?
            <a href="{% url 'signup' %}">
                Create an Account
            </a>
        </p>
    </div>

</form>
